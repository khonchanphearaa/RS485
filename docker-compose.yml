version: '3.8'

services:

  # database
  mysql:
    image: mysql:8.0
    container_name: meter-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: meter_db
      MYSQL_USER: meter_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - meter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # water-reader meter
  w-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w-reader
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./config/meter_config_water.json:/app/config/meter_config.json:ro
    networks:
      - meter-network
      - host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # electric-reader meter
  e-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-reader
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./config/meter_config_electric.json:/app/config/meter_config.json:ro
    networks:
      - meter-network
      - host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meter-network:
    driver: bridge
  host:
    external: true

volumes:
  mysql_data: